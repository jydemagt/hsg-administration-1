name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hsg_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, zip, json, gd, curl, simplexml, mbstring
          coverage: none
      - name: Kør testpakke
        env:
          HSG_TEST_DB_HOST: 127.0.0.1
          HSG_TEST_DB_NAME: hsg_test
          HSG_TEST_DB_USER: root
          HSG_TEST_DB_PASS: root
        run: bash tests/run.sh
